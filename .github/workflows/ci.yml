name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pg, POSTGRES_DB: pe_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: apps/api}}
    env:
      PGPASSWORD: pg
      DATABASE_URL: postgresql+psycopg://pe_app:a@localhost:5432/pe_ci
      MIGRATE_DATABASE_URL: postgresql+psycopg://pe_owner:o@localhost:5432/pe_ci
      APP_DB_ROLE: pe_app
      REDIS_TEST_URL: redis://localhost:6379/0
      RLS_TEST_APP_URL: postgresql+psycopg://pe_app:a@localhost:5432/pe_ci
      RLS_TEST_OWNER_URL: postgresql+psycopg://pe_owner:o@localhost:5432/pe_ci
      RLS_TEST_APP_ROLE: pe_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Roles (owner owns schema; app role is not superuser and cannot bypass RLS)
        run: |
          psql -h localhost -U postgres pe_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pe_owner LOGIN PASSWORD 'o';
          CREATE ROLE pe_app LOGIN PASSWORD 'a' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE pe_ci OWNER TO pe_owner;
          GRANT ALL ON SCHEMA public TO pe_owner;
          GRANT USAGE ON SCHEMA public TO pe_app;
          SQL
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: End-to-end smoke (live server, Postgres, non-owner role)
        env:
          ADMIN_TOKEN: ci-admin
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          python ../../scripts/smoke.py http://localhost:8000 ci-admin || { cat /tmp/api.log; exit 1; }
  compose-e2e:
    runs-on: ubuntu-latest
    env: {ADMIN_TOKEN: ci-admin}
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Wait for API
        run: for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
      - name: Web serves the UI
        run: curl -sf localhost:8080/ | grep -qi "<div id"
      - name: End-to-end smoke through the container
        run: python3 scripts/smoke.py http://localhost:8000 ci-admin
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
  llm-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_PROVIDER: llamacpp
      LLAMA_MODEL_PATH: ${{ github.workspace }}/models/gemma-2-9b-it-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with: {path: models, key: gguf-gemma-2-9b-it-q4km-v1}
      - name: Fetch model weights (cached)
        run: |
          mkdir -p models
          [ -f "$LLAMA_MODEL_PATH" ] || curl -fsSL -o "$LLAMA_MODEL_PATH" \
            https://huggingface.co/bartowski/gemma-2-9b-it-GGUF/resolve/main/gemma-2-9b-it-Q4_K_M.gguf
      - run: pip install -e 'apps/api[dev]' llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Local-model evals, gated (must pass)
        run: python evals/run_llm_eval.py > llm-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: llm-eval, path: llm-eval.json}
