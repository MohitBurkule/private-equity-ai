[project]
name = "pe-api"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pypdf>=4", "openpyxl>=3.1", "alembic>=1.13", "python-docx>=1.1", "python-pptx>=1.0", "python-multipart>=0.0.9"]
[project.optional-dependencies]
llm = ["anthropic>=0.40"]
ocr = ["rapidocr-onnxruntime>=1.3", "pypdfium2>=4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
[tool.setuptools]
packages = ["app"]
