dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pypdf>=4"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]
[tool.setuptools]
packages = ["app"]
