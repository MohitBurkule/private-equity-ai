[project]
name = "pe-api"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "pypdf>=4", "openpyxl>=3.1", "alembic>=1.13", "python-docx>=1.1", "python-pptx>=1.0", "python-multipart>=0.0.9", "redis>=5", "cryptography>=42", "PyJWT>=2.8", "pymupdf>=1.24"]
[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dense = ["fastembed>=0.4"]
llamacpp = ["llama-cpp-python>=0.3"]
pdf = ["pdfplumber>=0.11"]
ocr = ["rapidocr-onnxruntime>=1.3", "pypdfium2>=4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "boto3>=1.34", "paramiko>=3.4", "moto[server]>=5", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
charts = ["docling>=2", "matplotlib>=3.8"]
[tool.setuptools]
packages = ["app"]
