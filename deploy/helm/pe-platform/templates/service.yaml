apiVersion: v1
kind: Service
metadata:
  name: {{ include "pe.name" . }}
  labels: {{- include "pe.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pe-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
