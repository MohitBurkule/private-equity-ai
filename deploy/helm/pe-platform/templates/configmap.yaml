apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pe.name" . }}
  labels: {{- include "pe.labels" . | nindent 4 }}
data:
  APP_DB_ROLE: {{ .Values.app.appDbRole | quote }}
  RATE_LIMIT_BACKEND: {{ .Values.app.rateLimitBackend | quote }}
  SPOOL_DIR: {{ .Values.app.spoolDir | quote }}
  {{- if .Values.otel.endpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- end }}
