services:
  api:
    build: apps/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://pe_app:change-me-app@db:5432/pe
      MIGRATE_DATABASE_URL: postgresql+psycopg://pe_owner:change-me-owner@db:5432/pe
      APP_DB_ROLE: pe_app
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN to enable tenant creation}
      SPOOL_DIR: /spool
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: pe-platform@localhost
    volumes:
      - spool:/spool
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      mailpit: {condition: service_started}
  web:
    build: apps/web
    ports: ["8080:80"]
    depends_on: [api]
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: pe, POSTGRES_PASSWORD: pe, POSTGRES_DB: pe}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pe -d pe"]
      interval: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
  redis:
    image: redis:7
  mailpit:
    # Dev-only fake mail server: SMTP on 1025, web UI and API on 8025. Nothing leaves the stack.
    image: axllent/mailpit:v1.21.8
    ports: ["8025:8025"]
  greenmail:
    # Dev-only mock mail server (open source, github.com/greenmail-mail-test/greenmail): SMTP 3025, IMAP 3143.
    # Used by tests/test_greenmail_e2e.py to exercise the generic IMAP connector against a real IMAP server.
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap -Dgreenmail.setup.test.smtp -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=ic@firm.test:app-pass -Dgreenmail.auth.disabled=false
    ports: ["3025:3025", "3143:3143"]
  wiremock:
    # Dev-only mock of SaaS HTTP APIs (Graph, Drive, CRM, Slack, Teams). Stubs are posted per test to /__admin.
    # Point tests at it with WIREMOCK_URL=http://localhost:8089 (see docs/MOCKS.md).
    image: wiremock/wiremock:3.9.1
    # HTTPS on 8443 with a self-signed SYNTHETIC cert (deploy/mocks/tls/make-cert.sh) for the market-data feed.
    command: ["--https-port", "8443", "--https-keystore", "/home/wiremock/tls/keystore.p12",
              "--keystore-password", "synthetic", "--key-manager-password", "synthetic"]
    ports: ["8089:8080", "8443:8443"]
    volumes: ["./deploy/mocks/wiremock/mappings:/home/wiremock/mappings:ro", "./deploy/mocks/tls/out:/home/wiremock/tls:ro"]
  keycloak:
    # Dev-only OIDC provider for SSO role testing. Realm is SYNTHETIC (deploy/mocks/keycloak).
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes: ["./deploy/mocks/keycloak/realm-synthetic.json:/opt/keycloak/data/import/realm-synthetic.json:ro"]
    ports: ["8081:8080"]
  sftp:
    # Dev-only SFTP drop for fund-admin files. User fundadmin, password is a fixed test value.
    image: atmoz/sftp:alpine
    command: ["fundadmin:drop-pass:1001::drop"]
    ports: ["2222:22"]
volumes:
  pgdata:
  spool:
