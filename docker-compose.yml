services:
  api:
    build: apps/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://pe:pe@db:5432/pe
    depends_on: [db, redis]
  web:
    build: apps/web
    ports: ["8080:80"]
    depends_on: [api]
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: pe, POSTGRES_PASSWORD: pe, POSTGRES_DB: pe}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
volumes:
  pgdata:
